<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LED Switch Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #111827; }
    canvas { display: block; }
    #hint {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      color: #9ca3af;
      font-family: system-ui, sans-serif;
      font-size: 0.875rem;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hint">Click the switch to toggle the LED</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.167.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.167.1/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111827);

    const camera = new THREE.PerspectiveCamera(
      50,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 2, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.5, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.35));
    const keyLight = new THREE.DirectionalLight(0xffffff, 0.8);
    keyLight.position.set(3, 6, 4);
    scene.add(keyLight);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(10, 10),
      new THREE.MeshStandardMaterial({ color: 0x1f2937 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.01;
    scene.add(floor);

    let ledOn = true;

    const ledGeometry = new THREE.SphereGeometry(0.35, 32, 32);
    const ledMaterial = new THREE.MeshStandardMaterial({
      color: 0x22c55e,
      emissive: 0x00ff44,
      emissiveIntensity: 1.2,
      metalness: 0.1,
      roughness: 0.4,
    });
    const led = new THREE.Mesh(ledGeometry, ledMaterial);
    led.position.set(-1.2, 0.35, 0);
    scene.add(led);

    const switchGeometry = new THREE.BoxGeometry(0.8, 0.4, 0.5);
    const switchMaterial = new THREE.MeshStandardMaterial({ color: 0x6b7280 });
    const switchBox = new THREE.Mesh(switchGeometry, switchMaterial);
    switchBox.position.set(1.2, 0.2, 0);
    switchBox.userData.isSwitch = true;
    scene.add(switchBox);

    const switchLever = new THREE.Mesh(
      new THREE.BoxGeometry(0.15, 0.25, 0.15),
      new THREE.MeshStandardMaterial({ color: 0xe5e7eb })
    );
    switchLever.position.set(0, 0.05, 0.22);
    switchBox.add(switchLever);

    function updateLed() {
      if (ledOn) {
        ledMaterial.emissive.setHex(0x00ff44);
        ledMaterial.emissiveIntensity = 1.2;
        ledMaterial.color.setHex(0x22c55e);
        switchLever.position.z = 0.22;
      } else {
        ledMaterial.emissive.setHex(0x333333);
        ledMaterial.emissiveIntensity = 0.15;
        ledMaterial.color.setHex(0x374151);
        switchLever.position.z = -0.22;
      }
    }

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    function onPointerDown(event) {
      pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObject(switchBox, true);

      if (hits.length > 0) {
        ledOn = !ledOn;
        updateLed();
      }
    }

    renderer.domElement.addEventListener('pointerdown', onPointerDown);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    updateLed();
    animate();
  </script>
</body>
</html>
