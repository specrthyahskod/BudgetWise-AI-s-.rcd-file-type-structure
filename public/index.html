<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upgrade to BudgetWise Pro</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #0F172A; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #1E293B; border: 1px solid #334155; padding: 2rem; border-radius: 12px; text-align: center; max-width: 350px; width: 100%; }
    .price { font-size: 2rem; font-weight: bold; color: #F8FAFC; margin: 1rem 0; }
    button { background-color: #16A34A; color: white; border: none; padding: 12px 24px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; }
    button:hover { background-color: #15803D; }
  </style>
</head>
<body>
  <div class="card">
    <h2>⭐ BudgetWise Pro</h2>
    <div class="price">$4.99 AUD / mo</div>
    <p>Unlock EWMA Velocity forecasting and full student tool access.</p>
    <button id="checkout-btn">Upgrade Now</button>
  </div>

  <script>
    document.getElementById('checkout-btn').addEventListener('click', async () => {
      const btn = document.getElementById('checkout-btn');
      btn.innerText = 'Loading...';
      btn.disabled = true;

      try {
        const response = await fetch('/.netlify/functions/create-checkout', {
          method: 'POST',
        });
        const data = await response.json();

        if (data.url) {
          window.location.href = data.url;
        } else {
          alert('Error initializing checkout');
          btn.innerText = 'Upgrade Now';
          btn.disabled = false;
        }
      } catch (err) {
        console.error(err);
        alert('Payment request failed');
        btn.innerText = 'Upgrade Now';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
